# Install at /etc/nginx/conf.d/screenoff-log-format.conf on US1 so the format exists in the http block.
# The update-serving locations in screenoff-updates.conf reference it by name.
#
# The client IP is deliberately absent. Each running copy checks for updates about once a day, so the
# request count is already the activity signal; keeping addresses out of the log removes the only field
# that could tie a request back to a person.
log_format screenoff_updates '$time_iso8601 $status "$request" "$http_user_agent"';

# Include inside the frameflowtech.com TLS server block on US1.HETZ.HSB.
# A separate root keeps website deployments from replacing update artifacts.
location ^~ /updates/screenoff/latest/ {
    alias /var/www/screenoff-updates/latest/;
    autoindex off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location ~ ^/updates/screenoff/(v[0-9]+\.[0-9]+\.[0-9]+)/(ScreenOff\.(zip|dmg)|appcast\.xml|SHA256SUMS)$ {
    alias /var/www/screenoff-updates/$1/$2;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Keep incoming uploads, locks and any unrecognized files private.
location /updates/screenoff {
    return 404;
}

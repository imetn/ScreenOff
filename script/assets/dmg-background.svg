<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360">
  <defs>
    <linearGradient id="background" x1="22" y1="12" x2="538" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(136 168) rotate(90) scale(190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60B7FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#60B7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="236" y1="180" x2="324" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62B6FF"/>
      <stop offset="1" stop-color="#2488EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3279B5" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="url(#background)"/>
  <rect width="560" height="360" fill="url(#glow)"/>

  <text x="280" y="48" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="18" font-weight="600" fill="#17324D">拖入“应用程序”完成安装</text>
  <text x="280" y="72" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="12" fill="#668199">Screen Off 会常驻在菜单栏</text>

  <g filter="url(#shadow)">
    <rect x="76" y="102" width="152" height="164" rx="30" fill="#FFFFFF" fill-opacity="0.70"/>
    <rect x="332" y="102" width="152" height="164" rx="30" fill="#FFFFFF" fill-opacity="0.70"/>
  </g>
  <rect x="76.5" y="102.5" width="151" height="163" rx="29.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"/>
  <rect x="332.5" y="102.5" width="151" height="163" rx="29.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"/>

  <path d="M238 180H314" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M304 167L318 180L304 193" fill="none" stroke="#2488EC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="280" y="326" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="11" fill="#7890A5">关闭屏幕 · 保持在线</text>
</svg>
